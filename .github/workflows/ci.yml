name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(ImobFIIs/|ImobFIIsTests/|ImobFIIs\.xcodeproj/|Config/|\.swiftlint\.yml$|\.github/workflows/ci\.yml$)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app changes; skipping SwiftLint and Xcode tests."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  swiftlint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.63.3
          SWIFTLINT_SHA256: fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6
        run: |
          ARCHIVE="$RUNNER_TEMP/portable_swiftlint.zip"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  ${ARCHIVE}" | shasum -a 256 --check
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

  sentiment-scripts:
    name: Sentiment Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r agents/fii-sentiment/requirements.txt

      - name: Run script tests
        run: python -m unittest discover -s agents/fii-sentiment/tests -v

      - name: Validate published reports
        run: |
          for report in docs/sentiment/{paper,urban,logistics,malls,offices,fiagro}.json; do
            python agents/fii-sentiment/scripts/validate_report.py "$report"
          done

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      # O CoreSimulator do runner às vezes demora a listar os dispositivos e o xcodebuild
      # desiste de achar o simulador pelo nome; resolvemos o UDID com retentativas.
      - name: Resolve simulator
        id: simulator
        env:
          DEVICE_NAME: iPhone 17
        run: |
          for attempt in 1 2 3 4 5; do
            UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          name = os.environ["DEVICE_NAME"]
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((key for key in runtimes if ".iOS-" in key), reverse=True)
          for key in ios:
              for device in runtimes[key]:
                  if device["name"] == name and device.get("isAvailable", True):
                      print(device["udid"])
                      sys.exit(0)
          ' || true)
            if [ -n "$UDID" ]; then
              echo "Using $DEVICE_NAME ($UDID)"
              echo "udid=$UDID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Simulator not listed yet (attempt $attempt); retrying in 15s..."
            sleep 15
          done
          echo "::error::Could not find an available '$DEVICE_NAME' simulator."
          xcrun simctl list devices available
          exit 1

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme ImobFIIs \
            -destination 'id=${{ steps.simulator.outputs.udid }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
